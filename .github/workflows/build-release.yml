name: Build and publish v0.1.2 alpha

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Expand v0.1.2 source patch
        run: |
          if [ -d .bootstrap-v012 ]; then
            echo "2d14616e422f7571328f8d3e4375b9ff84b943174dd2d2755bc57361c175e91e  .bootstrap-v012/part00" | sha256sum -c -
            echo "c7775e0202d7c90aebf39d9dc9ec31597115c785e7e1d1c7fd943a1361337a3f  .bootstrap-v012/part010" | sha256sum -c -
            echo "d681064e63b781a891a210441a03c08e59ae419c8325c02b733c0f35f0ef5212  .bootstrap-v012/part011" | sha256sum -c -
            echo "647458b803163248235bf6d803d62a9b020330d37edc9d71a2d61a4b79606f87  .bootstrap-v012/part020" | sha256sum -c -
            echo "da6d64388c1c390fffcf523f1af66fedba8b6ee4e843fcf5133919e4164b6e33  .bootstrap-v012/part021" | sha256sum -c -
            echo "f0ba8256f798d0bb27958cedeb58590124acc20f2847a9295647a36a0a413654  .bootstrap-v012/part030" | sha256sum -c -
            echo "974098318fd68ef9e28c78fb02599c79758a8ff6ef589ef857602416f4010413  .bootstrap-v012/part0310" | sha256sum -c -
            echo "9b22c4f371c43852bd9a429c595c83f5d0418f78f25820ac5aed9d1fa0efda49  .bootstrap-v012/part0311" | sha256sum -c -
            echo "c511bcf4a81af9902fabf048d80191b8405cd3a09e60b9d4b66122b1c7294dcb  .bootstrap-v012/part040" | sha256sum -c -
            echo "6f8f7bfd2614f80bb22b7fd9c2a55da54e2af71e40c2c8c56670652664110629  .bootstrap-v012/part041" | sha256sum -c -
            echo "1a409103f69c748871eb3dd59f0f3cc53823a824eb52a7900096b7e300d54c2f  .bootstrap-v012/part05" | sha256sum -c -
            cat .bootstrap-v012/part00 \
                .bootstrap-v012/part010 \
                .bootstrap-v012/part011 \
                .bootstrap-v012/part020 \
                .bootstrap-v012/part021 \
                .bootstrap-v012/part030 \
                .bootstrap-v012/part0310 \
                .bootstrap-v012/part0311 \
                .bootstrap-v012/part040 \
                .bootstrap-v012/part041 \
                .bootstrap-v012/part05 > patch.b64
            echo "4791b3b0f3c98e2cd6c5663afaf780ad456ab2ec0eb85d111d8aa0d4cd29fc1c  patch.b64" | sha256sum -c -
            base64 --decode patch.b64 > patch.zip
            unzip -o patch.zip
            rm -rf patch.b64 patch.zip .bootstrap-v012
          fi

      - name: Publish expanded source to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Fix authentication and native source parsing"
            git push origin HEAD:main
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build installable APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare release asset
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/Minecraft-AIO-v0.1.2-alpha.apk
          sha256sum release/Minecraft-AIO-v0.1.2-alpha.apk > release/Minecraft-AIO-v0.1.2-alpha.apk.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-AIO-v0.1.2-alpha
          path: release/*

      - name: Create or repair GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.1.2-alpha
        run: |
          TARGET="$(git rev-parse HEAD)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* \
              --target "$TARGET" \
              --title "Minecraft AIO v0.1.2-alpha" \
              --notes "Fixes MCPEDL native parsing, Bedrock Tweaks TLS host handling, provider-specific sign-in buttons, secure Google Custom Tab sign-in, dark authentication UI, and user-friendly native network errors." \
              --prerelease
          fi
