plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.alastorkaneki.minecrafthub'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.alastorkaneki.minecrafthub'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    buildFeatures {
        aidl true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}
